[package]
name = "bus_channel_strip"
version = "1.0.0"
edition = "2021"
authors = ["Your Name <your@email.com>"]
license = "GPL-3.0-or-later"
homepage = "https://fsecada01.github.io/bus_channel_strip/"
description = "Professional 6-module bus channel strip with Punch (clipper + transient shaper)"

[workspace]
members = ["xtask", "advisor"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# nih_plug's own README (maintenance mode) points to nice-plug as its
# community-endorsed successor, co-authored by nih_plug's original author.
# Pinned to the 0.1.x line: nice-plug-core jumped to a redesigned Editor
# trait (host-driven ResizeHint/EditorHandle::set_size) at 0.2.0/0.3.0, but
# vizia_plug's current implementation still targets nice-plug-core ^0.1.5 —
# using nice-plug 0.2+ here would fail to compile against vizia_plug.
nice-plug = "0.1.10"
augmented-dsp-filters = "2.5.0"
biquad = "0.5.0"
fundsp = "0.23.0"
idsp = "0.21.0"
# vizia-plug for GUI integration with nice-plug
vizia_plug = { git = "https://github.com/vizia/vizia-plug.git", optional = true }
# Use skia-safe with features that have pre-built binaries for Windows
# Note: x11 is Linux-only, removed for cross-platform compatibility
atomic_float = { version = "0.1", optional = true }
realfft = "3.5.0"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
default = ["api5500", "buttercomp2", "pultec", "transformer", "punch", "haas", "dynamic_eq", "sheen"]
# GUI now uses iced-rs instead of egui for better stability
# Core DSP modules
api5500 = []
buttercomp2 = []
pultec = []
transformer = []
punch = []
haas = []
# Master-end polish coat (always pinned, default ON, factory tuning per spec).
sheen = []

# Advanced modules (hierarchical)
dynamic_eq = []
"dynamic_eq.diff" = ["dynamic_eq"]
"dynamic_eq.multiband" = ["dynamic_eq"]

# UI system
gui = ["vizia_plug", "atomic_float"]
# Uncomment the below line to disable the on-by-default VST3 feature to remove
# the GPL compatibility requirement



[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1   # full inlining + better auto-vectorization across crate boundaries
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[build-dependencies]
cc = "1.0"
chrono = "0.4"
