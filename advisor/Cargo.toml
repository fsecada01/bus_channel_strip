[package]
name = "bcs-advisor"
version = "0.1.0"
edition = "2021"
description = "Mix advisor HTTP service for Bus Channel Strip — studio profiles + Claude API"
license = "GPL-3.0-or-later"

[[bin]]
name = "bcs-advisor"
path = "src/main.rs"

[dependencies]
axum            = "0.8.9"
tokio           = { version = "1.53.1", features = ["full"] }
serde           = { version = "1.0.229", features = ["derive"] }
serde_json      = "1.0.151"
reqwest         = { version = "0.13.5", features = ["json", "rustls"], default-features = false }
tower           = { version = "0.5.3", features = ["util"] }
tower-http      = { version = "0.7.1", features = ["cors", "trace", "normalize-path"] }
tracing         = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow          = "1.0.104"
